<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatik-Color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">
        <h1 class="header-title">Chromatik Color</h1>
    </header>

    <main class="main contenedor">
        <div class="contenefor-form">
            <h2 class="main-title">Elige Tu diseño</h2>

            <form class="form-main" action="">

                <fieldset class="fieldset-form">

                    <legend>Paleta de colores</legend>

                    <div class="contenido-form">
                        <label class="label-main" id="tipo" for="">Tipo de paleta:</label>
                        <select class="select-main" name="tipo" id="tipo">
                            <option value="Hexa">Hexa</option>
                            <option value="HSL">HSL</option>
                            <option value="RGB">RGB</option>
                        </select>

                    </div>

                    <label class="label-main" for="tamaño">Tamaño:</label>

                    <div class="contenedor-radio">

                        <div>
                            <input type="radio" name="cantidad" id="6" value="6">
                            <label for="6">6 colores</label>
                        </div>

                        <div>
                            <input type="radio" name="cantidad" id="8" value="8">
                            <label for="8">8 colores</label>
                        </div>
                        <div>
                            <input type="radio" name="cantidad" id="9" value="9">
                            <label for="9">9 colores</label>
                        </div>
                    </div>
                </fieldset>

                <input class="boton-submit" type="submit" value="Generar paleta">

            </form>
        </div>


        <section class="paleta-colores"></section>
    </main>

    <script src="js/js.js"></script>
</body>

</html>
